<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eef3fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="班车助手">
  <title>班车助手 · NudtBus13</title>
  <meta property="og:title" content="班车助手 · NudtBus13">
  <meta property="og:description" content="校区通勤与院内通勤双向规划">
  <meta property="og:image" content="./assets/og-image.jpg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="loading">
  <div class="bg-mesh" aria-hidden="true"></div>

  <header class="nav glass">
    <div class="nav-inner">
      <div class="nav-brand">
        <img class="nav-logo" src="./assets/icons/icon-192.png" alt="">
        <span class="nav-title">班车助手</span>
      </div>
      <span class="nav-clock" id="currentTime">--:--</span>
    </div>
    <div class="mode-seg" role="tablist" aria-label="服务模式">
      <span class="mode-thumb" id="modeThumb"></span>
      <button class="mode-btn active" data-mode="campus" role="tab" type="button">🚌 校区通勤</button>
      <button class="mode-btn" data-mode="inner" role="tab" type="button">🏫 院内通勤</button>
    </div>
  </header>

  <main class="shell">
    <div id="holidayBanner" class="banner" hidden>⚠️ <span id="holidayBannerText"></span></div>

    <!-- 规划器 -->
    <section class="card glass rise" style="--d:.05s">
      <button class="pick-card" id="fromPick" type="button">
        <span class="pick-label">从哪出发</span>
        <span class="pick-value placeholder" id="fromValue">点击选择上车点</span>
      </button>
      <div class="pick-divider">
        <button class="swap" id="swapBtn" type="button" title="交换起终点">⇅</button>
      </div>
      <button class="pick-card" id="toPick" type="button">
        <span class="pick-label">去哪上班</span>
        <span class="pick-value placeholder" id="toValue">点击选择目的地</span>
      </button>
      <button class="btn-primary" id="querySubmit" type="button">规划班次</button>
    </section>

    <!-- 结果 -->
    <section class="card glass rise" style="--d:.12s">
      <div class="card-head">
        <h2>规划结果</h2>
        <span class="pill" id="dayLabel">--</span>
      </div>
      <p class="meta" id="queryMeta">选择起终点后规划班次</p>
      <div id="resultList" class="result-list">
        <div class="skeleton-block"></div>
      </div>
    </section>

    <!-- 班车表明细 -->
    <section class="card glass card-collapse rise" style="--d:.19s" id="timetableCard">
      <button class="collapse-head" id="ttToggle" type="button" aria-expanded="false">
        <span class="collapse-title">📖 班车表明细</span>
        <span class="chevron">›</span>
      </button>
      <div class="collapse-body">
        <div class="collapse-inner">
          <div class="seg-control small" id="ttTabs" role="tablist">
            <span class="seg-thumb" id="ttThumb"></span>
            <button class="seg active" data-profile="monThu" type="button">周一至四</button>
            <button class="seg" data-profile="friday" type="button">周五</button>
            <button class="seg" data-profile="saturday" type="button">周六</button>
            <button class="seg" data-profile="sunday" type="button">周日</button>
          </div>
          <p class="meta" id="ttHint"></p>
          <div id="timetableList" class="tt-list">
            <div class="skeleton-block"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 地图 -->
    <section class="card glass rise" style="--d:.26s" id="mapPanel">
      <div class="card-head">
        <h2>线路地图</h2>
        <span class="pill">坐标已校准</span>
      </div>
      <div id="map" class="map"></div>
      <p class="meta">🟢 已定位站点 · 🟡 校区内近似位置 · 点击明细中的线路卡片可在地图高亮</p>
    </section>

    <footer class="footer">
      <p>班车助手 · NudtBus13 · 数据快照 2026-08-27 · 假期停运安排以学校通知为准</p>
      <p><a href="https://github.com/Jensen-Yao/NudtBus13" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </main>

  <!-- 站点选择器 -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="选择站点" hidden>
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h3 id="sheetTitle">从哪出发</h3>
      <button class="sheet-close" id="sheetClose" type="button">完成</button>
    </div>
    <input class="input sheet-search" id="sheetSearch" type="search" placeholder="搜索站点" autocomplete="off">
    <div class="sheet-recent" id="sheetRecent" hidden></div>
    <div class="sheet-list" id="sheetList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script src="./app.js?v=13.3"></script>
</body>
</html>
