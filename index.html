<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="班车助手">
  <title>班车助手</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <span class="nav-title">🚌 班车助手</span>
      <span class="nav-clock" id="currentTime">--:--</span>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <h1 class="large-title">班车助手</h1>
      <p class="sub-title" id="currentDate">--</p>
    </section>

    <div id="holidayBanner" class="banner" hidden>⚠️ <span id="holidayBannerText"></span></div>

    <section class="card">
      <div class="seg-row">
        <div class="field">
          <span class="label">从</span>
          <select id="fromStop" class="select"></select>
        </div>
        <button id="swapBtn" class="swap" title="交换起终点">⇅</button>
        <div class="field">
          <span class="label">到</span>
          <select id="toStop" class="select"></select>
        </div>
      </div>
      <div class="seg-control" role="tablist">
        <button class="seg active" data-query-mode="now" type="button">现在出发</button>
        <button class="seg" data-query-mode="manual" type="button">稍后出发</button>
      </div>
      <div class="manual-wrap is-hidden" id="manualField">
        <input class="input" id="queryDateTime" type="datetime-local">
      </div>
      <button class="btn-primary" id="querySubmit" type="button">查询</button>
    </section>

    <section class="card" id="resultPanel">
      <div class="card-head">
        <h2>查询结果</h2>
        <span class="pill" id="dayLabel">--</span>
      </div>
      <p class="meta" id="queryMeta">选择起终点后点击查询</p>
      <div id="resultList" class="result-list"></div>
    </section>

    <section class="card card-collapse" id="timetableCard">
      <button class="collapse-head" id="ttToggle" type="button" aria-expanded="false">
        <span class="collapse-title">📖 班车表明细</span>
        <span class="chevron" id="ttChevron">›</span>
      </button>
      <div class="collapse-body" id="timetableBody" hidden>
        <div class="seg-control small" id="ttTabs" role="tablist">
          <button class="seg active" data-profile="monThu" type="button">周一至四</button>
          <button class="seg" data-profile="friday" type="button">周五</button>
          <button class="seg" data-profile="saturday" type="button">周六</button>
          <button class="seg" data-profile="sunday" type="button">周日</button>
        </div>
        <p class="meta" id="ttHint"></p>
        <div id="timetableList" class="tt-list"></div>
      </div>
    </section>

    <section class="card" id="mapPanel">
      <div class="card-head">
        <h2>线路地图</h2>
        <span class="pill">已校准坐标</span>
      </div>
      <div id="map" class="map"></div>
      <p class="meta">🟢 已定位站点 · 🟡 校区内近似位置 · 点击时刻表卡片可在地图上高亮线路</p>
    </section>

    <footer class="footer">
      <p>班车助手 · 数据快照 2026-08-27 · 假期停运安排以学校通知为准</p>
      <p><a href="https://github.com/Jensen-Yao/NudtBus13" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
